<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giappone 26/27</title>
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Giappone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f1e7;--card:#fffdf8;--ink:#1f1d1a;--soft:#6b655b;--line:#e4dccb;--red:#c8372d;--tokyo:#2f4b7c;--hakone:#3f7d5a;--kyoto:#c8372d;--nara:#7d8b3a;--osaka:#d08a1e;--roma:#7a6a58;--r:16px;
--serif:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;--sans:"Zen Kaku Gothic New",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hero{position:relative;padding:22px 0 18px;overflow:hidden}
.sun{position:absolute;right:-30px;top:-20px;width:150px;height:150px;border-radius:50%;background:var(--red);opacity:.92}
.hero h1{font-family:var(--serif);font-size:34px;line-height:1.1;margin:0;position:relative;letter-spacing:.5px}
.hero h1 small{display:block;font-size:15px;font-family:var(--sans);font-weight:500;color:var(--soft);letter-spacing:2px;margin-bottom:6px}
.count{margin-top:10px;font-size:15px;color:var(--soft);position:relative}
.count b{color:var(--ink);font-size:22px;font-family:var(--serif)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:14px;font-size:13px;position:relative}
.route span.c{padding:3px 9px;border-radius:99px;color:#fff;font-weight:500}
.route i{color:var(--soft);font-style:normal}
.status{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:30;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 8px #0001;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa}
.dot.ok{background:#3f7d5a}.dot.busy{background:var(--osaka)}.dot.loc{background:var(--tokyo)}.dot.err{background:var(--red)}
h2.sec{font-family:var(--serif);font-size:24px;margin:18px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden;box-shadow:0 1px 0 #0000000a}
.day-h{display:flex;gap:12px;padding:14px;cursor:pointer;align-items:flex-start;width:100%;background:none;border:0;text-align:left}
.date{flex:0 0 52px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.date .n{font-family:var(--serif);font-size:28px;line-height:1;font-weight:700}
.date .m{font-size:11px;letter-spacing:1.5px;color:var(--soft);text-transform:uppercase}
.date .w{font-size:11px;color:var(--soft)}
.day-b{flex:1;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;padding:2px 9px;border-radius:99px}
.tag .jp{font-family:var(--serif);font-weight:500;opacity:.85}
.sum{margin-top:6px;font-size:14.5px;color:var(--ink)}
.sum .prog{color:var(--soft);font-size:12px}
.chev{flex:0 0 auto;color:var(--soft);transition:transform .2s;margin-top:4px}
.open .chev{transform:rotate(180deg)}
.today{outline:2px solid var(--red);outline-offset:-2px}
.today-lbl{font-size:11px;font-weight:700;color:var(--red);letter-spacing:1px;margin-left:6px}
.day-d{padding:0 14px 14px;border-top:1px dashed var(--line)}
.lbl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);margin:14px 0 6px;font-weight:700}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #efe8da}
ul.items li:last-child{border-bottom:0}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.chk.on{background:var(--hakone);border-color:var(--hakone);color:#fff}
.it-t{flex:1;min-width:0}
.done .it-t{text-decoration:line-through;color:var(--soft)}
.pin{flex:0 0 auto;font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--soft);background:#fff}
.stay{display:flex;gap:10px;align-items:center;background:#f3ecdf;border-radius:12px;padding:10px 12px;font-size:14.5px}
.tips{margin:0;padding-left:18px;font-size:14px;color:#3d3a35}
.tips li{margin:4px 0}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.red{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.x{border:0;background:none;color:var(--red);font-size:20px;padding:0 6px;cursor:pointer}
.meta{font-size:12px;color:var(--soft);margin-top:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--soft);padding:4px 6px;min-width:58px;cursor:pointer}
nav.tabs button .ic{font-family:var(--serif);font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--red)}
.todo{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #efe8da}
.todo:last-child{border-bottom:0}
.todo .d{font-size:12px;color:var(--soft)}
.pad{padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.kv b{font-weight:700}
.phr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14.5px}
.phr .jp{font-family:var(--serif);color:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;box-shadow:0 6px 20px #0003}
.empty{color:var(--soft);font-size:14px;font-style:italic}
.flt{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.flt button{flex:0 0 auto}
.flt .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.via{font-size:12px;color:var(--soft)}
.hint{border-color:var(--red);background:#fff6f2}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(31,29,26,.45);display:grid;place-items:center;padding:20px}
.dlg{background:var(--card);border-radius:20px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 50px #0004}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body></html>
