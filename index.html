<!DOCTYPE html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giappone 26/27</title>
<meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110e" media="(prefers-color-scheme: dark)">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("jp2627-theme")||"auto"}catch(e){document.documentElement.dataset.theme="auto"}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Giappone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{--paper:#f5efe3;--paper2:#efe6d4;--card:#fffdf8;--field:#fff;--ink:#1f1d1a;--soft:#756e62;--line:#e6dccb;--line2:#efe7d8;--stay:#f3ebdc;--hint:#fff3ee;--red:#c8372d;--sunA:#e0503f;--sunB:#b52a22;--wave:rgba(47,75,124,.07);--shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.06);
--tokyo:#2f4b7c;--hakone:#3f7d5a;--kyoto:#c8372d;--nara:#7d8b3a;--osaka:#c97d12;--roma:#7a6a58;--r:18px;
--serif:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP",Georgia,serif;--sans:"Zen Kaku Gothic New",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color-scheme:light}
:root[data-theme=dark]{--paper:#13110e;--paper2:#1a1714;--card:#1d1a16;--field:#26221d;--ink:#efe7d8;--soft:#a39a8b;--line:#332d25;--line2:#2a251f;--stay:#27221b;--hint:#2a1b17;--red:#e2574a;--sunA:#e2574a;--sunB:#9e2a20;--wave:rgba(239,231,216,.045);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);--tokyo:#5a7bb5;--hakone:#4f9a70;--kyoto:#e0574a;--nara:#9aa94c;--osaka:#e09a35;--roma:#9c8a74;color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme=auto]{--paper:#13110e;--paper2:#1a1714;--card:#1d1a16;--field:#26221d;--ink:#efe7d8;--soft:#a39a8b;--line:#332d25;--line2:#2a251f;--stay:#27221b;--hint:#2a1b17;--red:#e2574a;--sunA:#e2574a;--sunB:#9e2a20;--wave:rgba(239,231,216,.045);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);--tokyo:#5a7bb5;--hakone:#4f9a70;--kyoto:#e0574a;--nara:#9aa94c;--osaka:#e09a35;--roma:#9c8a74;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;transition:background .3s,color .3s}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
/* hero */
.hero{position:relative;padding:50px 16px 26px;overflow:hidden;max-width:none;background:
 radial-gradient(circle at 50% 100%,transparent 18px,var(--wave) 19px,var(--wave) 22px,transparent 23px,transparent 30px,var(--wave) 31px,var(--wave) 34px,transparent 35px) 0 0/48px 24px;
 border-bottom:1px solid var(--line)}
.hero>*{max-width:608px;margin-left:auto;margin-right:auto}
.sun{position:absolute;right:max(-34px,calc(50% - 360px));top:-26px;width:168px;height:168px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--sunA),var(--sunB));box-shadow:0 0 60px rgba(200,55,45,.25);margin:0}
.hero h1{font-family:var(--serif);font-size:40px;line-height:1.05;margin:0 auto;position:relative;letter-spacing:.5px;font-weight:700}
.hero h1 small{display:block;font-size:12px;font-family:var(--sans);font-weight:700;color:var(--red);letter-spacing:3px;margin-bottom:8px}
.count{margin-top:12px;font-size:15px;color:var(--soft);position:relative}
.count b{color:var(--ink);font-size:24px;font-family:var(--serif)}
.dates{font-size:13px;color:var(--soft);position:relative;margin-top:2px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:16px;font-size:12.5px;position:relative}
.route span.c{padding:3px 10px;border-radius:99px;color:#fff;font-weight:700;letter-spacing:.2px}
.route i{color:var(--soft);font-style:normal;opacity:.6}
.status{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--soft);display:flex;gap:6px;align-items:center;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#999}
.dot.ok{background:#3f9a63}.dot.busy{background:#d99a2b}.dot.loc{background:#5a7bb5}.dot.err{background:var(--red)}
h2.sec{font-family:var(--serif);font-size:26px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;font-weight:700}
h2.sec span{font-size:13px;color:var(--red);font-weight:500;letter-spacing:2px;order:2}
.wrap>h2.sec:first-child{margin-top:calc(46px + env(safe-area-inset-top))}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:12px 0;overflow:hidden;box-shadow:var(--shadow);position:relative}
.card.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cc)}
.day-h{display:flex;gap:14px;padding:16px 14px 16px 18px;cursor:pointer;align-items:flex-start;width:100%;background:none;border:0;text-align:left}
.date{flex:0 0 50px;text-align:center;padding-top:2px}
.date .n{font-family:var(--serif);font-size:30px;line-height:1;font-weight:700}
.date .m{font-size:10.5px;letter-spacing:2px;color:var(--cc);text-transform:uppercase;font-weight:700}
.date .w{font-size:11px;color:var(--soft);margin-top:2px}
.day-b{flex:1;min-width:0;border-left:1px solid var(--line2);padding-left:14px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#fff;padding:2px 9px;border-radius:99px}
.tag .jp{font-family:var(--serif);font-weight:500;opacity:.85}
.via{font-size:12px;color:var(--soft)}
.sum{margin-top:6px}
.sum .ttl{font-family:var(--serif);font-size:17.5px;font-weight:700;display:block;line-height:1.3}
.sum .sub{color:var(--soft);font-size:13.5px;margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--soft)}
.bar i{flex:1;max-width:120px;height:4px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--cc);border-radius:4px;transition:width .4s}
.chev{flex:0 0 auto;color:var(--soft);transition:transform .25s;margin-top:6px}
.open .chev{transform:rotate(180deg)}
.today{border-color:var(--red);box-shadow:0 0 0 2px var(--red),var(--shadow)}
.today-lbl{font-size:10.5px;font-weight:700;color:#fff;background:var(--red);letter-spacing:1px;margin-left:6px;padding:2px 7px;border-radius:99px}
.day-d{padding:2px 16px 16px 18px;border-top:1px dashed var(--line);animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.lbl{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin:16px 0 6px;font-weight:700}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
ul.items li:last-child{border-bottom:0}
.chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--field);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font-size:14px;transition:all .2s}
.chk.on{background:var(--hakone);border-color:var(--hakone);transform:scale(1.05)}
.it-t{flex:1;min-width:0}
.done .it-t{text-decoration:line-through;color:var(--soft)}
.pin{flex:0 0 auto;font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--soft);background:var(--field);white-space:nowrap}
.pin::before{content:"📍 ";font-size:11px}
.stay{display:flex;gap:10px;align-items:center;background:var(--stay);border-radius:14px;padding:11px 12px;font-size:14.5px}
.tips{margin:0;padding:0;list-style:none;font-size:14px}
.tips li{margin:6px 0;padding-left:20px;position:relative;color:var(--ink);opacity:.9}
.tips li::before{content:"";position:absolute;left:4px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--red);opacity:.7}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--field);font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea:focus,input[type=text]:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,55,45,.12)}
textarea{min-height:88px;resize:vertical}
::placeholder{color:var(--soft);opacity:.7}
.row{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:9px 15px;font-size:14px;cursor:pointer;font-weight:500}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.x{border:0;background:none;color:var(--red);font-size:22px;padding:0 6px;cursor:pointer}
.meta{font-size:12px;color:var(--soft);margin-top:6px}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:20;width:calc(100% - 20px);max-width:480px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;display:flex;justify-content:space-around;box-shadow:0 8px 30px rgba(0,0,0,.12)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:10.5px;color:var(--soft);padding:6px 4px;flex:1;cursor:pointer;border-radius:16px;transition:background .2s,color .2s}
nav.tabs button .ic{font-family:var(--serif);font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);font-weight:700}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:0}
.todo .d{font-size:12px;color:var(--soft)}
.pad{padding:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;align-items:center}
.kv b{font-family:var(--serif);font-size:22px;color:var(--red)}
.phr{display:grid;grid-template-columns:1fr auto;gap:10px 12px;font-size:14.5px;align-items:center}
.phr .jp{font-family:var(--serif);color:var(--soft);text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:90vw;box-shadow:0 6px 20px #0004}
.empty{color:var(--soft);font-size:14px;font-style:italic}
.flt{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.flt button{flex:0 0 auto}
.flt .on,.seg .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1}
.hint{border-color:var(--red);background:var(--hint)}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(10,8,6,.55);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.dlg{background:var(--card);border-radius:24px;padding:26px;width:100%;max-width:360px;box-shadow:0 20px 50px #0005;border:1px solid var(--line)}
.stay-name{font-family:var(--serif);font-size:19px;margin:8px 0 2px;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body></html>
